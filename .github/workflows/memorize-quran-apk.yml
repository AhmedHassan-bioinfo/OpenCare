name: Build Memorize Quran APK

on:
  push:
    branches:
      - memorize-quran-apk-build
    paths:
      - 'memorize-quran-build/**'
      - '.github/workflows/memorize-quran-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract and normalize Android project
        run: |
          rm -rf build-apk
          mkdir build-apk
          unzip -q memorize-quran-build/MemorizeQuran_APKSource_lite.zip -d build-apk
          SETTINGS="$(find build-apk -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -1)"
          if [ -n "$SETTINGS" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS")"
          else
            PROJECT_DIR="$(find build-apk -type f -name build.gradle -printf '%h\n' | while read d; do [ -d "$d/app" ] && echo "$d"; done | head -1)"
          fi
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          cat > "$PROJECT_DIR/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = 'MemorizeQuran'
          include ':app'
          EOF

          cat > "$PROJECT_DIR/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > "$PROJECT_DIR/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.memorizequran.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.memorizequran.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  debug {
                      minifyEnabled false
                  }
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF
          touch "$PROJECT_DIR/app/proguard-rules.pro"
          echo "Project dir: $PROJECT_DIR"
          find "$PROJECT_DIR/app/src/main" -maxdepth 5 -type f | sort | head -120

      - name: Build debug APK
        run: |
          gradle --no-daemon -p "$PROJECT_DIR" assembleDebug --stacktrace
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' | head -1)"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/MemorizeQuran.apk"
          ls -lh "$GITHUB_WORKSPACE/MemorizeQuran.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemorizeQuran-APK
          path: MemorizeQuran.apk
          if-no-files-found: error
          retention-days: 7

      - name: Save APK on build branch
        run: |
          mkdir -p memorize-quran-build/output
          cp MemorizeQuran.apk memorize-quran-build/output/MemorizeQuran.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f memorize-quran-build/output/MemorizeQuran.apk
          git commit -m "Add built Memorize Quran APK [skip ci]" || exit 0
          git push origin HEAD:memorize-quran-apk-build
